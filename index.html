<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <h1 class="title">Simple Calculator</h1>

        <div class="display-section">
            <label>Expression</label>
            <input type="text" id="display" readonly>
        </div>

        <div class="display-section">
            <label>Result</label>
            <input type="text" id="result" readonly>
        </div>

        <div class="buttons">

            <button class="clear-btn" onclick="clearDisplay()">C</button>
            <button class="operator-btn" onclick="backspace()">⌫</button>
            <button class="operator-btn" onclick="addValue('%')">%</button>
            <button class="operator-btn" onclick="addValue('/')">÷</button>

            <button class="number-btn" onclick="addValue('7')">7</button>
            <button class="number-btn" onclick="addValue('8')">8</button>
            <button class="number-btn" onclick="addValue('9')">9</button>
            <button class="operator-btn" onclick="addValue('*')">×</button>

            <button class="number-btn" onclick="addValue('4')">4</button>
            <button class="number-btn" onclick="addValue('5')">5</button>
            <button class="number-btn" onclick="addValue('6')">6</button>
            <button class="operator-btn" onclick="addValue('-')">−</button>

            <button class="number-btn" onclick="addValue('1')">1</button>
            <button class="number-btn" onclick="addValue('2')">2</button>
            <button class="number-btn" onclick="addValue('3')">3</button>
            <button class="operator-btn" onclick="addValue('+')">+</button>

            <button class="number-btn" onclick="addValue('0')">0</button>
            <button class="number-btn" onclick="addValue('.')">.</button>
            <button class="operator-btn" onclick="addValue('%')">mod</button>
            <button class="equal-btn" onclick="calculate()">=</button>


    <script src="script.js"></script>

</body>

</html>
